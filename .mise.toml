# `.python-version` is the single source of truth for the Python version: uv reads
# it natively (it is the only file-based Python pin uv honors), and this setting
# makes mise read the same file instead of a second, drift-prone pin here.
[settings]
idiomatic_version_file_enable_tools = ["python"]

[tools]
uv = "0.11.7"
node = "24"
"aqua:google/osv-scanner" = "2.4.0"
# mise 2026.4 drops the pipx backend's `extras` option when it delegates to uv,
# so include the Python plugin explicitly until that release is retired.
"pipx:habit-hooks" = { version = "1.3.1", uvx_args = "--with habit-hooks-python==1.3.1 --with habit-hooks-typescript==1.3.1" }

# Strict, lockfile-only installs. The loose forms (`uv sync`, `npm install`)
# rewrite the lockfiles in place, so a manifest that had drifted out of sync with
# its lock would be silently repaired in CI, pass `check`, and only surface on the
# same commit as a failed `npm ci` in the image build — or, worse, an image whose
# `uv sync --frozen` quietly installed the stale lock. Drift must fail here.
# Add dependencies deliberately: `uv add <pkg>` / `npm install <pkg> --prefix frontend`.
# The browser download obeys the same rule: `playwright install` fetches exactly the
# build that the locked `@playwright/test` version expects, and is a no-op once present.
[tasks.setup]
description = "Install backend and frontend dependencies from the lockfiles."
run = """
uv sync --locked
npm --prefix frontend ci
npm --prefix frontend exec -- playwright install --with-deps chromium
"""

[tasks.test]
description = "Run the backend test suite with verbose output."
run = "uv run pytest -v"

[tasks.python-quality]
description = "Run Python lint, formatting, typing, dependency, architecture, and dead-code gates."
run = """
uv run ruff check src tests
uv run ruff format --check src tests
uv run pyright
uv run deptry src
uv run lint-imports
uv run vulture
"""

[tasks.habit-hooks]
description = "Run Habit Hooks' Python and TypeScript code-smell coaching."
run = """
habit-hooks
cd frontend
habit-hooks --config ../.habit-hooks/frontend.toml
"""

# Builds the production bundle, then serves it through uvicorn on a private port
# (see `frontend/playwright.config.ts`), so the suite can never pass against a
# stale `dist` or against whatever is holding port 8100. The build runs here
# rather than inside Playwright's `webServer` so that a TypeScript or Vite error
# is a readable failure instead of a server start-up timeout. `VITE_API_BASE_URL`
# is cleared so a developer's local `frontend/.env` cannot point the built bundle
# at a different backend.
#
# `npm run` (not `npm exec`) because only `run` changes directory into
# `frontend/`, where `playwright.config.ts` lives.
[tasks.e2e]
description = "Run the Playwright end-to-end suite for the promoted UI regression scenarios."
run = """
VITE_API_BASE_URL= npm --prefix frontend run build
npm --prefix frontend run e2e
"""

[tasks.api-contract]
description = "Confirm generated frontend API types match FastAPI's OpenAPI schema."
run = "scripts/check-api-contract.sh"

[tasks.security]
description = "Scan both dependency lockfiles for known vulnerabilities."
run = "osv-scanner scan source --recursive ."

[tasks.check]
description = "Run all tests, quality, architecture, contract, security, and browser gates."
# `e2e` runs last, and covers the production-build gate: it builds `frontend/dist`
# itself, so a separate `npm run build` here would only build the same bundle
# twice. It is also the slowest and most environment-dependent step, so every
# cheap deterministic gate gets to fail first.
run = """
mise run python-quality
uv run pytest
npm --prefix frontend run quality
npm --prefix frontend run test
mise run habit-hooks
mise run api-contract
mise run security
mise run e2e
"""

[tasks.serve]
description = "Run the API server."
run = "uv run uvicorn kcap.api:app --host 0.0.0.0 --port 8100"

[tasks.api-dev]
description = "Run the API server with automatic reload."
run = "uv run uvicorn kcap.api:app --host 0.0.0.0 --port 8100 --reload"

[tasks.frontend-dev]
description = "Run the Vite frontend development server."
run = "npm --prefix frontend run dev"

[tasks.dev]
description = "Run the API and frontend development servers."
run = """
uv run uvicorn kcap.api:app --host 0.0.0.0 --port 8100 --reload &
api_pid=$!
trap 'kill $api_pid 2>/dev/null || true' EXIT INT TERM
npm --prefix frontend run dev
"""

[tasks.container-build]
description = "Build the combined production container."
run = "docker build -t kcap:local ."

[tasks.container-up]
description = "Build and run the combined container with Compose."
run = "docker compose up --build"

# Plain-docker twin of container-up for hosts without the compose plugin
# (e.g. colima Macs). The flags mirror compose.yaml — keep them in sync.
[tasks.container-run]
description = "Build and run the container with plain docker (no compose needed)."
run = """
docker build -t kcap:local .
docker rm -f kcap 2>/dev/null || true
docker run -d --name kcap --init \
  -p 8100:8100 \
  -e KCAP_CORS_ORIGINS=http://localhost:8100 \
  --read-only --tmpfs /tmp:rw,size=16m \
  --security-opt no-new-privileges:true \
  kcap:local
echo "kcap running at http://localhost:8100 — stop with: mise run container-down"
"""

[tasks.container-down]
description = "Stop and remove the plain-docker kcap container."
run = "docker rm -f kcap"
