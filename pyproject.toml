[project]
name = "kcap"
# Placeholder. kcap is deployed as a container, not published to an index, so the
# real version lives in the git tag and image tag that go-semantic-release creates.
# Nothing writes back here; the running app reports its version from KCAP_VERSION,
# which the image build injects. See `kcap.__init__._resolve_version`.
version = "0.0.0"
description = "Capacity planner that packs pod requests onto nodes to model HPA behavior, node counts, and the fragmentation aggregate arithmetic hides."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Gary Ellis", email = "gary.luis.ellis@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.12.5",
    "uvicorn>=0.52.3",
]

[project.scripts]
kcap = "kcap:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "httpx2>=2.10.0",
    "import-linter>=2.3",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "vulture>=2.14",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C90",
    "S",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.importlinter]
root_packages = ["kcap"]

[[tool.importlinter.contracts]]
name = "HTTP and schema layers depend inward on the capacity engine"
type = "layers"
layers = [
    "kcap.api",
    "kcap.schemas",
    "kcap.engine",
]

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 80

[tool.deptry]
known_first_party = ["kcap"]
